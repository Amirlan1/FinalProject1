<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            margin: 0;
            padding: 0;
        }

        header {
            padding: 40px;
            text-align: center;
            background: #020617;
        }

        h1 {
            font-size: 36px;
        }

        .container {
            max-width: 400px;
            margin: 60px auto;
            background: #020617;
            padding: 30px;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            border-radius: 6px;
            border: none;
            outline: none;
            background: #1e293b;
            color: white;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .link {
            text-align: center;
            margin-top: 15px;
        }

        .link a {
            color: #60a5fa;
            text-decoration: none;
        }

        .message {
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
            padding: 10px;
            border-radius: 6px;
        }

        .error {
            color: #f87171;
            background: rgba(248, 113, 113, 0.1);
        }

        .success {
            color: #34d399;
            background: rgba(52, 211, 153, 0.1);
        }
    </style>
</head>
<body>

<header>
    <h1>Reset Password</h1>
</header>

<div class="container">

    {% if error %}
    <div class="message error">{{ error }}</div>
    {% endif %}
    {% if message %}
    <div class="message success">{{ message }}</div>
    <div class="link">
        Go to <a href="/login">Login</a>
    </div>
    {% else %}

    <form method="post">
        <input type="hidden" name="token" value="{{ token }}">
        
        <label>New Password</label>
        <input type="password" name="new_password" required placeholder="Enter new password" minlength="6">

        <button type="submit">Reset Password</button>
    </form>

    <div class="link">
        Back to <a href="/login">Login</a>
    </div>
    {% endif %}

</div>

</body>
</html>

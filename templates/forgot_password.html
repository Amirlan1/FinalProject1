<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Забыл пароль</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            margin: 0;
            padding: 0;
        }

        header {
            padding: 40px;
            text-align: center;
            background: #020617;
        }

        h1 {
            font-size: 36px;
        }

        .container {
            max-width: 400px;
            margin: 60px auto;
            background: #020617;
            padding: 30px;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            border-radius: 6px;
            border: none;
            outline: none;
            background: #1e293b;
            color: white;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .link {
            text-align: center;
            margin-top: 15px;
        }

        .link a {
            color: #60a5fa;
            text-decoration: none;
        }

        .message {
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .error {
            color: #f87171;
        }

        .success {
            color: #34d399;
        }
    </style>
</head>
<body>

<header>
    <h1>Восстановление пароля</h1>
</header>

<div class="container">

    {% if error %}
    <div class="message error">{{ error }}</div>
    {% endif %}
    {% if message %}
    <div class="message success">{{ message }}</div>
    {% endif %}

    <form method="post">
        <label>Email</label>
        <input type="email" name="email" required placeholder="Введите ваш email">

        <button type="submit">Отправить ссылку</button>
    </form>

    <div class="link">
        Вернуться на <a href="/login">вход</a>
    </div>
</div>

</body>
</html>

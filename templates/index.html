<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Crypto Platform</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            margin: 0;
            padding: 0;
        }

        header {
            padding: 40px;
            text-align: center;
            background: #020617;
        }

        h1 {
            font-size: 36px;
        }

        .buttons {
            margin-top: 25px;
        }

        .buttons a {
            text-decoration: none;
            padding: 12px 25px;
            margin: 10px;
            background: #2563eb;
            color: white;
            border-radius: 6px;
            font-weight: bold;
        }

        .container {
            padding: 40px;
            max-width: 900px;
            margin: auto;
        }

        .news {
            background: #020617;
            padding: 25px;
            border-radius: 8px;
        }

        .news h2 {
            margin-bottom: 15px;
        }

        .news ul {
            list-style: none;
            padding: 0;
        }

        .news li {
            padding: 10px 0;
            border-bottom: 1px solid #1e293b;
        }
    </style>
</head>
<body>

<header>
    <h1>Добро пожаловать на </h1>
    <p></p>

    <div class="buttons">
  {% if user %}
    <a href="/profile">Профиль</a>
    <a href="/logout">Выход</a>
  {% else %}
    <a href="/register">Регистрация</a>
    <a href="/login">Вход</a>
  {% endif %}
</div>
</header>

<div class="container">
    <div class="news">
        <h2>Основные новости</h2>
        <ul>
            {% for item in news %}
                <li>{{ item }}</li>
            {% endfor %}
        </ul>
    </div>
</div>

</body>
</html>

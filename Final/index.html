<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Stock Price Chart</h1>

    <!-- Форма для выбора тикера акции -->
    <form action="/update_graph/" method="post">
        <input type="text" name="ticker" value="{{ ticker }}" placeholder="Enter Stock Ticker (e.g., AAPL)" required>
        <button type="submit">Update Chart</button>
    </form>

    <!-- График -->
    <canvas id="stockChart" width="400" height="200"></canvas>

    <script>
        const ctx = document.getElementById('stockChart').getContext('2d');
        const chartData = {{ chart_data | tojson }};
        
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: chartData.labels,
                datasets: [{
                    label: 'Stock Price',
                    data: chartData.data,
                    borderColor: 'rgb(75, 192, 192)',
                    fill: false
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'top',
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return `$${context.raw.toFixed(2)}`; // Форматируем цену
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        type: 'category', // Обычная категория для дат
                    },
                    y: {
                        ticks: {
                            beginAtZero: false,
                            callback: function(value) { return `$${value.toFixed(2)}`; } // Форматируем ось Y
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>

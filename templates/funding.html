<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Funding</title>

  <link rel="stylesheet" href="/static/styles.css" />
  <script src="/static/app.js" defer></script>
</head>

<body>
  <div class="topbar">
    <a class="brand" href="/">STOCKING</a>

    <div class="controls">
      <a class="btn ghost" href="/">Back to Chart</a>
      <a class="btn ghost" href="/profile">Profile</a>
      <button id="switchDemo" class="btn">Switch DEMO</button>
      <button id="switchReal" class="btn primary">Switch REAL</button>
    </div>

    <div class="rightinfo">
      <div class="mini">
        <div class="miniLabel">Mode</div>
        <div id="mode" class="miniVal">—</div>
      </div>
      <div class="mini">
        <div class="miniLabel">Cash</div>
        <div id="cash" class="miniVal">—</div>
      </div>
      <div class="mini">
        <div class="miniLabel">Equity</div>
        <div id="eq" class="miniVal">—</div>
      </div>
    </div>
  </div>

  <div class="layout onecol">
    <div class="main">
      <div class="card">
        <div class="cardTitle">Deposit (REAL account only)</div>

        <div class="note">
          Only accepts not real cards that start with <b>9999</b>.
        </div>

        <div class="formGrid">
          <div>
            <div class="k">Amount</div>
            <input id="depAmount" class="input w100" type="number" value="100" min="1" step="1" />
          </div>

          <div>
            <div class="k">Name on card</div>
            <input id="ccName" class="input w100" value="Name" />
          </div>

          <div>
            <div class="k">Card number (FAKE only)</div>
            <input id="ccNum" class="input w100" placeholder="9999...." />
          </div>

          <div>
            <div class="k">Exp (MM/YY)</div>
            <input id="ccExp" class="input w100" value="12/30" />
          </div>

          <div>
            <div class="k">CVC</div>
            <input id="ccCvc" class="input w100" value="123" />
          </div>

          <div>
            <div class="k">Actions</div>
            <div class="rowBtns">
              <button id="genCard" class="btn">Generate FAKE card</button>
              <button id="doDeposit" class="btn primary">Deposit</button>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="cardTitle">Withdraw (REAL account only)</div>

        <div class="formGrid">
          <div>
            <div class="k">Amount</div>
            <input id="wdAmount" class="input w100" type="number" value="50" min="1" step="1" />
          </div>

          <div>
            <div class="k">Actions</div>
            <div class="rowBtns">
              <button id="doWithdraw" class="btn bad">Withdraw</button>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="cardTitle">Orders</div>
        <div id="ord" class="table"></div>
      </div>

      <div id="err" class="error hidden"></div>
    </div>
  </div>
</body>
</html>

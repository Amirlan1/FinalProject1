<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stocking</title>

  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script src="/static/app.js" defer></script>
</head>

<body>
  <div class="topbar">
    <a class="brand" href="/">STOCKING</a>

    <div class="controls">
      <input id="sym" list="symList" value="AAPL" class="input" placeholder="Symbol (AAPL, TSLA, MSFT)" />
      <datalist id="symList">
        <option value="AAPL"></option>
        <option value="MSFT"></option>
        <option value="TSLA"></option>
        <option value="NVDA"></option>
        <option value="AMZN"></option>
        <option value="GOOGL"></option>
        <option value="META"></option>
        <option value="NFLX"></option>
      </datalist>

      <select id="tf" class="input">
        <option value="1Day" selected>1Day</option>
        <option value="1Hour">1Hour (demo)</option>
      </select>

      <select id="lim" class="input">
        <option value="0" selected>ALL TIME</option>
        <option value="200">200 bars</option>
        <option value="1000">1000 bars</option>
        <option value="5000">5000 bars</option>
      </select>

      <button id="btnLoad" class="btn primary">Load</button>
      <button id="btnMA" class="btn">MA 20/50</button>
      <button id="btnBuy" class="btn good">Buy 1</button>
      <button id="btnSell" class="btn bad">Sell 1</button>
      <button id="btnReset" class="btn ghost">Reset</button>
    </div>

    <div class="rightinfo">
      <div class="mini">
        <div class="miniLabel">Mode</div>
        <div id="mode" class="miniVal">—</div>
      </div>
      <div class="mini">
        <div class="miniLabel">Cash</div>
        <div id="cash" class="miniVal">—</div>
      </div>
      <div class="mini">
        <div class="miniLabel">Equity</div>
        <div id="eq" class="miniVal">—</div>
      </div>

      <div id="accountWrap" class="accountWrap">
        <button id="btnAccount" class="btn accountBtn">Account ▾</button>
        <div id="accountMenu" class="menu hidden">
          <a class="menuItem" href="/profile">Profile</a>
          <a class="menuItem" href="/funding">Deposit / Withdraw</a>
          <div class="menuSep"></div>
          <button id="toDemo" class="menuBtn">Switch to DEMO</button>
          <button id="toReal" class="menuBtn">Switch to REAL</button>
        </div>
      </div>
    </div>
  </div>

  <div class="layout">
    <div class="main">
      <div class="panelTitle">
        <div id="title">Chart</div>
        <div class="hint">Modebar: line/rect/circle + eraser</div>
      </div>

      <div id="chart" class="chart"></div>
      <div class="note">История: Stooq daily. Не real-time.</div>
    </div>

    <div class="side">
      <div class="card">
        <div class="cardTitle">Positions</div>
        <div id="pos" class="table"></div>
      </div>

      <div class="card">
        <div class="cardTitle">Orders</div>
        <div id="ord" class="table"></div>
      </div>

      <div id="err" class="error hidden"></div>
    </div>
  </div>
</body>
</html>

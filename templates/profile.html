<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile</title>

    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/profile.js" defer></script>
    <script src="/static/app.js" defer></script>
</head>
<body style="background:#0f172a; color:white; font-family:Arial;">

  <div class="topbar">
    <a class="brand" href="/">STOCKING</a>

    <div class="controls">
      <a class="btn primary" href="/workspace">Back to Chart</a>
      <a class="btn primary" href="/funding">Deposit / Withdraw</a>
      <a class="btn primary" href="/">Leave</a>
    </div>

    <div class="rightinfo">
      <div class="mini">
    <div class="miniLabel">Mode</div>
    <div id="mode" class="miniVal">—</div>
</div>
<div class="mini">
    <div class="miniLabel">Cash</div>
    <div id="cash" class="miniVal">—</div>
</div>
<div class="mini">
    <div class="miniLabel">Equity</div>
    <div id="eq" class="miniVal">—</div>
</div>

      </div>
    </div>
  </div>

  <div class="layout onecol">
    <div class="main">

      <div class="card">
        <div class="cardTitle">Account Profile</div>
        <div class="k">
          <p><b>Username:</b> {{ username }}</p>
          <p><b>Email:</b> {{ email }}</p>
        </div>
        <img src="/static/LOGO2.png" alt="Profile photo">

        <div>
          <div class="k">Actions</div>
          <div class="rowBtns">
            <button id="btnResetProfile" class="btn ghost">Reset account</button>
            <button id="switchDemo" class="btn">Switch DEMO</button>
            <button id="switchReal" class="btn">Switch REAL</button>
            <button id="btnSupport" class="btn ghost">Support</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="cardTitle">Positions</div>
        <div id="pos" class="table"></div>
      </div>

      <div class="card">
        <div class="cardTitle">Orders</div>
        <div id="ord" class="table"></div>
      </div>

      <div id="err" class="error hidden"></div>
    </div>
  </div>

  <div id="supportModal" class="modal hidden">
    <div class="modal-content">
      <h2>Support</h2>
      <form id="supportForm">
        <input type="text" name="subject" placeholder="Тема" required>
        <textarea name="message" placeholder="Опишите вашу проблему..." required></textarea>
        <button type="submit">Send</button>
        <button type="button" onclick="closeSupport()">Cancel</button>
      </form>
    </div>
  </div>

</body>
</html>

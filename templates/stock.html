<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Stocks</title>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <style>
    body { font-family: Arial; padding: 20px; }
    #err { color: crimson; white-space: pre-wrap; margin-top: 10px; }
    #ok { color: green; white-space: pre-wrap; margin-top: 10px; }
    .row { margin: 8px 0; }
  </style>
</head>
<body>
  <h3>Stocks (Chart + Buy/Sell)</h3>

  <div class="row">
    <input id="sym" value="AAPL" />
    <select id="tf">
      <option value="1Day">1Day</option>
      <option value="1Hour">1Hour</option>
    </select>
    <button onclick="loadBars()">Load chart</button>
    <button onclick="loadAccount()">Account</button>
    <button onclick="loadPositions()">Positions</button>
  </div>

  <div class="row">
    <input id="qty" type="number" value="1" min="1" />
    <button onclick="sendOrder('buy')">BUY</button>
    <button onclick="sendOrder('sell')">SELL</button>
  </div>

  <div id="ok"></div>
  <div id="err"></div>
  <div id="chart" style="width:950px;height:520px;"></div>
  <pre id="data"></pre>

<script>
  function show(okMsg, errMsg) {
    document.getElementById("ok").textContent = okMsg || "";
    document.getElementById("err").textContent = errMsg || "";
  }

  async function loadBars() {
    show("", "");
    const sym = document.getElementById("sym").value.trim();
    const tf = document.getElementById("tf").value;

    const r = await fetch(`/api/bars?symbol=${encodeURIComponent(sym)}&timeframe=${encodeURIComponent(tf)}&limit=200`);
    const j = await r.json();
    if (!r.ok) { show("", j.detail || "error"); return; }

    const x = j.map(p => p.time);
    const y = j.map(p => p.close);

    Plotly.newPlot("chart", [{ x, y, type: "scatter" }], { title: `${sym} close (${tf})` });
    show(`Loaded ${j.length} bars`, "");
  }

  async function loadAccount() {
    show("", "");
    const r = await fetch(`/api/account`);
    const j = await r.json();
    if (!r.ok) { show("", j.detail || "error"); return; }
    document.getElementById("data").textContent = JSON.stringify(j, null, 2);
    show("Account loaded", "");
  }

  async function loadPositions() {
    show("", "");
    const r = await fetch(`/api/positions`);
    const j = await r.json();
    if (!r.ok) { show("", j.detail || "error"); return; }
    document.getElementById("data").textContent = JSON.stringify(j, null, 2);
    show("Positions loaded", "");
  }

  async function sendOrder(side) {
    show("", "");
    const sym = document.getElementById("sym").value.trim();
    const qty = parseInt(document.getElementById("qty").value, 10);

    const r = await fetch(`/api/order?symbol=${encodeURIComponent(sym)}&qty=${qty}&side=${side}`, { method: "POST" });
    const j = await r.json();
    if (!r.ok) { show("", j.detail || "error"); return; }

    document.getElementById("data").textContent = JSON.stringify(j, null, 2);
    show(`Order sent: ${side.toUpperCase()} ${qty} ${sym}`, "");
  }
</script>
</body>
</html>
